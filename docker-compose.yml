services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuralwatt_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: neuralwatt
    volumes:
      - ./backend:/app
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: neuralwatt_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuralwatt_frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: neuralwatt_simulator
    env_file:
      - ./simulator/.env
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      SIM_EMAIL: simulator@neuralwatt.app
    volumes:
      - ./simulator:/app
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
